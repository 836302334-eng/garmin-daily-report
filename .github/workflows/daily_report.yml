name: Daily Garmin Report

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:   # 允许手动点击运行测试

permissions:
  contents: write      # 允许把生成的日报提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect==0.3.17 requests

      - name: Run Garmin report script
        env:
          GARMIN_USER: ${{ secrets.GARMIN_USER }}
          GARMIN_PASS: ${{ secrets.GARMIN_PASS }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPORT_DIR: reports
          DATE_OFFSET: '0'
          RETENTION_DAYS: '30'
        run: python garmin_report.py

      - name: Commit report back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Add Garmin report $(date +%F)"
          git push
